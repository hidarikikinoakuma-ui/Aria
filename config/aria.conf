# ARIA — Main Configuration
# ============================================================
# Player: Hidarikikinoaku (LeftHandDevil)
# Coach:  Aria (@migikonokami / RightHandGod)
# Target: Platinum II → Predator
# ============================================================

[player]
username         = Hidarikikinoaku
display_name     = LeftHandDevil
current_rank     = Gold 4
current_rp       = 143
rp_to_next       = 750
target_rank      = Predator
controller       = GameSir G7 Pro 8K

[aria]
name             = Aria
handle           = migikonokami
full_handle      = RightHandGod
personality      = firm_caring
voice_style      = balanced
# Voice style options: soft / firm / balanced
# balanced = Rem loyalty + Erza directness

[recording]
obs_host         = localhost
obs_port         = 4455
obs_password     =
# Leave obs_password blank if you haven't set one in OBS

replay_buffer_seconds = 90
clip_before_event     = 20
clip_after_event      = 8
# Clips are: 20 seconds before the knock/down + 8 after

clips_folder     = data/clips
sessions_folder  = data/sessions
reports_folder   = data/reports

[detection]
# Your EA / in-game username — EXACT spelling, case-sensitive
apex_username    = Hidarikikinoaku

[liveapi]
# Apex Live API WebSocket settings
# Apex runs a local WebSocket server during matches
# Aria connects to it automatically — no setup needed beyond the .bat file
liveapi_host     = 127.0.0.1
liveapi_port     = 7777
# Set to false to fall back to OCR kill feed (not recommended)
use_live_api     = true

# Screen capture region (auto-set on first run)
# Kill feed is top-right of screen
killfeed_x       = 0
killfeed_y       = 0
killfeed_w       = 0
killfeed_h       = 0
# Leave as 0,0,0,0 — auto-calibrated on first launch

# OCR confidence threshold (0.0 to 1.0)
ocr_confidence   = 0.65

# How often to check screen during match (seconds)
# Low value = more responsive, tiny CPU cost
poll_interval    = 0.5

[analysis]
# OpenAI API key — required for GPT-4o Vision fight analysis
openai_api_key   =
# Get yours at: https://platform.openai.com/api-keys

# Model for fight analysis
vision_model     = gpt-4o
coaching_model   = gpt-4o

# Max frames to send per fight clip (controls API cost)
max_frames_per_clip = 8

# How many clips to analyze per match (most impactful ones)
max_clips_per_match = 10

[youtube]
# Your YouTube channel (same Google account)
channel_id       =
# Leave blank — filled automatically on first OAuth login

# Upload schedule
upload_day       = sunday
upload_time      = 20:00
# Uploads every Sunday at 8pm

# Video settings
default_visibility = public
# Options: public / unlisted / private

# Channel branding
channel_name     = LeftHandDevil | Coached by Aria
channel_handle   = @Hidarikikinoaku
channel_tagline  = Gold 4 to Predator. My AI coach breaks down every mistake.

[social]
# Handles across platforms — all as Aria
tiktok_handle    = @migikonokami
instagram_handle = @migikonokami
twitter_handle   = @migikonokami
reddit_user      = u/migikonokami
twitch_channel   = migikonokami

# API keys — fill these in after creating accounts
tiktok_session_id    =
instagram_username   =
instagram_password   =
twitter_api_key      =
twitter_api_secret   =
twitter_access_token =
twitter_access_secret=
reddit_client_id     =
reddit_client_secret =

[mobile]
# Mobile companion server
host             = 0.0.0.0
port             = 8765
# Accessible on your local network
# Use Cloudflare Tunnel for access outside home

# Clip compression for mobile (lower = smaller files)
mobile_clip_quality  = medium
# Options: low / medium / high

[aria_overlay]
# Desktop overlay position
position         = bottom_right
# Options: bottom_right / bottom_left / top_right / top_left

# Overlay size (pixels)
sprite_width     = 300
sprite_height    = 400

# How long Aria stays on screen after coaching (seconds)
auto_dismiss     = 0
# 0 = stays until you click dismiss

# Startup behavior
show_on_startup  = true
voice_on_startup = true

[controller]
# GameSir G7 Pro 8K settings
# Vendor/Product IDs for HID detection
gamesir_vendor_id  = 0x3537
gamesir_product_id = 0x1011
# These are auto-detected if left default

# Input logging
log_inputs         = true
input_log_folder   = data/sessions

# Deadzone (0.0 to 1.0) — matches your in-game setting
stick_deadzone     = 0.10
trigger_deadzone   = 0.05

[notifications]
# Post-match desktop notification
desktop_notify   = true

# What triggers Aria to appear
trigger_on_match_end    = true
trigger_on_rank_change  = true
trigger_on_new_highlight= false
# Set to true if you want instant highlight notification

[logging]
log_level        = INFO
log_file         = logs/aria.log
max_log_size_mb  = 50
